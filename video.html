
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yenna Yemathayaa!!</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 30px 20px;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            background: linear-gradient(135deg, #181818, #393633, #171717);
        }

        video {
            display: block;
            width: 100%;
            max-width: 800px;
            height: auto;
            aspect-ratio: 16 / 9;
            background: black;
            border: 2px solid #625d56;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        video:hover {
            transform: scale(1.015);
        }

        h2 {
            max-width: 850px;
            padding: 25px;
            font-size: clamp(18px, 3vw, 27px);
            line-height: 1.7;
            color: #f2e9df;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-left: 4px solid #ff5a4f;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1s ease both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            body {
                gap: 22px;
                padding: 20px 14px;
            }

            video {
                border-radius: 12px;
            }

            h2 {
                padding: 18px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <video controls playsinline>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <h2>
        Yenna yemanthaya poo poi vera vela iruntha paaru poo 🤦🤦
        Yaaru enna sonnalum namba vendiyathuuu
    </h2>
</body>
</html>
